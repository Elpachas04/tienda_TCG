[build]
  command = "npm install && node scripts/prebuild.mjs --live && ng build --configuration production"
  publish = "dist/tcg3d-shop/browser"

[build.environment]
  NODE_VERSION = "22.22.3"
  NPM_FLAGS = "--include=dev"

[functions]
  directory      = "netlify/functions"
  node_bundler   = "esbuild"

# ── Security headers ────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://res.cloudinary.com; media-src 'self' https://res.cloudinary.com; connect-src 'self' https://res.cloudinary.com; frame-ancestors 'none'"

# ── Cache de assets estáticos ───────────────────────────────────────────────
[[headers]]
  for = "/assets/data/*.json"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── API → Netlify functions (must come before la SPA catch-all) ─────────────
[[redirects]]
  from = "/api/order"
  to   = "/.netlify/functions/send-telegram"
  status = 200

[[redirects]]
  from = "/api/shipping"
  to   = "/.netlify/functions/shipping-price"
  status = 200

