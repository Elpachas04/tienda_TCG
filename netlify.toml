[[redirects]]
  from = "/api/admin/session"
  to   = "/.netlify/functions/admin-session"
  status = 200

[[redirects]]
  from = "/api/admin/products"
  to   = "/.netlify/functions/admin-products-save"
  status = 200

[[redirects]]
  from = "/api/admin/catalog"
  to   = "/.netlify/functions/admin-catalog-save"
