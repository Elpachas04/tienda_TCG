[build]
  command = "npm install && ng build --configuration production"
  publish = "dist/tcg3d-shop/browser"

[build.environment]
  NODE_VERSION = "22.22.3"
  NPM_FLAGS = "--include=dev"

[functions]
  directory = "netlify/functions"

# ── Security headers ────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://res.cloudinary.com; connect-src 'self' https://res.cloudinary.com; frame-ancestors 'none'"

# ── API → Netlify functions (must come before the SPA catch-all) ────────────
[[redirects]]
  from = "/api/order"
  to   = "/.netlify/functions/send-telegram"
  status = 200

[[redirects]]
  from = "/api/shipping"
  to   = "/.netlify/functions/shipping-price"
  status = 200

# ── Angular SPA fallback ────────────────────────────────────────────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
