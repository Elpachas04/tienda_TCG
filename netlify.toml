# ── Rutas de la app sin HTML prerenderizado: las sirve index.html y las pinta Angular ──
# (las que sí tienen HTML — inicio, catálogo, fichas, legal — se sirven tal cual: estas reglas
#  no se aplican cuando existe el archivo)
[[redirects]]
  from   = "/product/*"
  to     = "/index.html"
  status = 200

[[redirects]]
  from   = "/checkout"
  to     = "/index.html"
  status = 200

[[redirects]]
  from   = "/seguimiento"
  to     = "/index.html"
  status = 200

[[redirects]]
  from   = "/valorar"
  to     = "/index.html"
  status = 200

[[redirects]]
  from   = "/gum-gum-berry"
  to     = "/index.html"
  status = 200

[[redirects]]
  from   = "/admin"
  to     = "/index.html"
  status = 200

[[redirects]]
  from   = "/admin/*"
  to     = "/index.html"
  status = 200

# ── Cualquier otra URL: página 404 con estado 404 de verdad (no un 200 que Google tome por página válida) ──
[[redirects]]
  from   = "/*"
  to     = "/404/index.html"
  status = 404
